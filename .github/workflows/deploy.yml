name: CD - Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to LKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Apply namespace
        run: |
          kubectl apply -f environments/production/namespace.yaml

      - name: Apply deployment
        run: |
          kubectl apply -f environments/production/deployment.yaml

      - name: Apply service
        run: |
          kubectl apply -f environments/production/service.yaml

      - name: Apply ingress
        run: |
          kubectl apply -f environments/production/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/express-api \
            -n express-api \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment express-api -n express-api
          kubectl get pods -n express-api
          kubectl get service express-api-service -n express-api
          kubectl get ingress express-api-ingress -n express-api